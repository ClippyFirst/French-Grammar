name: Deploy Astro to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test canonical coverage
        run: node --test test/canonical-coverage.test.mjs

      - name: Test design system
        run: node --test test/design-system.test.mjs

      - name: Test exam topics
        run: node --test test/exam-topics.test.mjs

      - name: Test markdown formatting
        run: node --test test/markdown-format.test.mjs

      - name: Test page helpers
        run: node --test test/pages.test.mjs

      - name: Test search
        run: node --test test/search.test.mjs

      - name: Audit canonical coverage
        run: npm run audit:canonical

      - name: Audit site categories
        run: npm run audit:site-categories

      - name: Audit content schema
        run: npm run audit:content-schema

      - name: Audit search
        run: npm run audit:search

      - name: Audit markdown formatting
        run: npm run audit:markdown-format

      - name: Generate canonical matrix
        run: npm run audit:canonical:matrix

      - name: Build static site
        run: npm run build

      - name: Audit production build
        run: npm run audit:alpha

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
